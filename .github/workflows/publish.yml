name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is needed by gh release create + tag push.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing OIDC requires npm >= 11.5.1.
      # Node 22 ships with npm 10.x, which uses the legacy token flow and
      # fails OIDC token exchange with a misleading "E404 not in this
      # registry" error on scoped packages.
      - name: Upgrade npm to latest (for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Check if version changed
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "none")
          echo "Local:     $LOCAL_VERSION"
          echo "Published: $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged — skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish (with provenance via OIDC)
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          # Extract the section for this version from CHANGELOG.md when it exists,
          # otherwise fall back to an autogenerated note. The awk block prints
          # everything between the matching `## [X.Y.Z]` heading and the next
          # `## [` heading (exclusive).
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
              capture && $0 ~ /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md)
          else
            NOTES=""
          fi

          if [ -z "$NOTES" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --notes "$NOTES"
          fi
